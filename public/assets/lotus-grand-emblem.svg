<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="emb-gold-crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="35%" stop-color="#F3C344" />
      <stop offset="70%" stop-color="#C58C18" />
      <stop offset="100%" stop-color="#905A02" />
    </linearGradient>

    <linearGradient id="emb-gold-petal-left" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="25%" stop-color="#FCD35B" />
      <stop offset="60%" stop-color="#D4991D" />
      <stop offset="90%" stop-color="#A56B08" />
      <stop offset="100%" stop-color="#704402" />
    </linearGradient>

    <linearGradient id="emb-gold-petal-right" x1="100%" y1="0%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#FFEFA0" />
      <stop offset="30%" stop-color="#EBB637" />
      <stop offset="70%" stop-color="#BD8212" />
      <stop offset="100%" stop-color="#7E4C03" />
    </linearGradient>

    <linearGradient id="emb-gold-center-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBD0" />
      <stop offset="30%" stop-color="#F8D155" />
      <stop offset="70%" stop-color="#C88E18" />
      <stop offset="100%" stop-color="#8F5805" />
    </linearGradient>

    <linearGradient id="emb-gold-center-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9D462" />
      <stop offset="40%" stop-color="#D4991D" />
      <stop offset="80%" stop-color="#996008" />
      <stop offset="100%" stop-color="#663C01" />
    </linearGradient>

    <linearGradient id="emb-gold-outer-left" x1="0%" y1="20%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#FFEC8B" />
      <stop offset="20%" stop-color="#F5C94B" />
      <stop offset="55%" stop-color="#C88C15" />
      <stop offset="85%" stop-color="#8E5704" />
      <stop offset="100%" stop-color="#D29923" />
    </linearGradient>

    <linearGradient id="emb-gold-outer-right" x1="100%" y1="20%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#FFE77D" />
      <stop offset="25%" stop-color="#EDB73A" />
      <stop offset="60%" stop-color="#B87B0E" />
      <stop offset="90%" stop-color="#7C4A02" />
      <stop offset="100%" stop-color="#C78E1A" />
    </linearGradient>

    <filter id="emb-gold-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#553000" flood-opacity="0.35" />
    </filter>

    <filter id="emb-petal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3A1E00" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#emb-gold-glow)">
    <!-- Top Crown Diamond Peak / Arch -->
    <path
      d="M 300 30 
         L 345 88 
         C 330 92 315 95 300 96 
         C 285 95 270 92 255 88 
         Z"
      fill="url(#emb-gold-crown)"
      stroke="#9B6204"
      stroke-width="1.5"
    />
    <path
      d="M 255 88 
         C 240 70 215 85 205 110 
         C 220 102 240 100 258 108 
         L 268 93 
         Z"
      fill="url(#emb-gold-crown)"
      opacity="0.9"
    />
    <path
      d="M 345 88 
         C 360 70 385 85 395 110 
         C 380 102 360 100 342 108 
         L 332 93 
         Z"
      fill="url(#emb-gold-crown)"
      opacity="0.85"
    />

    <!-- Outer Chalice - Left Wing -->
    <path
      d="M 125 150
         L 165 150
         C 165 240 190 320 300 415
         C 290 415 260 410 240 395
         C 160 340 125 255 125 150
         Z"
      fill="url(#emb-gold-outer-left)"
      stroke="#8D5603"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Outer Left Bevel Highlight -->
    <path
      d="M 125 150
         L 133 150
         C 133 250 166 335 242 393
         C 238 396 230 390 225 385
         C 152 332 125 245 125 150
         Z"
      fill="#FFE885"
      opacity="0.45"
    />

    <!-- Outer Chalice - Right Wing -->
    <path
      d="M 475 150
         L 435 150
         C 435 240 410 320 300 415
         C 310 415 340 410 360 395
         C 440 340 475 255 475 150
         Z"
      fill="url(#emb-gold-outer-right)"
      stroke="#7A4802"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
    <!-- Outer Right Bevel Highlight -->
    <path
      d="M 475 150
         L 467 150
         C 467 250 434 335 358 393
         C 362 396 370 390 375 385
         C 448 332 475 245 475 150
         Z"
      fill="#FFF3A8"
      opacity="0.35"
    />

    <!-- Outer Bottom Join -->
    <path
      d="M 235 390
         C 270 418 330 418 365 390
         C 340 425 260 425 235 390
         Z"
      fill="url(#emb-gold-crown)"
    />

    <!-- Inner Left Loop Petal -->
    <g filter="url(#emb-petal-shadow)">
      <path
        d="M 300 410
           C 210 350 190 270 215 170
           C 235 90 295 85 295 85
           C 295 85 255 125 245 190
           C 235 255 265 340 300 410
           Z"
        fill="url(#emb-gold-petal-left)"
        stroke="#945C05"
        stroke-width="1.5"
      />
      <path
        d="M 295 85
           C 270 115 250 165 242 225
           C 236 270 250 330 275 375
           C 260 350 242 295 240 240
           C 238 180 265 120 295 85
           Z"
        fill="#FFF9C4"
        opacity="0.5"
      />
    </g>

    <!-- Inner Right Loop Petal -->
    <g filter="url(#emb-petal-shadow)">
      <path
        d="M 300 410
           C 390 350 410 270 385 170
           C 365 90 305 85 305 85
           C 305 85 345 125 355 190
           C 365 255 335 340 300 410
           Z"
        fill="url(#emb-gold-petal-right)"
        stroke="#7A4802"
        stroke-width="1.5"
      />
      <path
        d="M 305 85
           C 330 115 350 165 358 225
           C 364 270 350 330 325 375
           C 340 350 358 295 360 240
           C 362 180 335 120 305 85
           Z"
        fill="#FFE885"
        opacity="0.4"
      />
    </g>

    <!-- Central Vertical Spire Petal -->
    <path
      d="M 300 32
         C 290 90 270 170 280 260
         C 285 315 295 365 300 412
         L 300 32
         Z"
      fill="url(#emb-gold-center-left)"
      stroke="#996006"
      stroke-width="1"
    />
    <path
      d="M 300 32
         C 310 90 330 170 320 260
         C 315 315 305 365 300 412
         L 300 32
         Z"
      fill="url(#emb-gold-center-right)"
      stroke="#7A4802"
      stroke-width="1"
    />
    <line
      x1="300"
      y1="34"
      x2="300"
      y2="410"
      stroke="#FFFBD0"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.75"
    />
  </g>
</svg>
